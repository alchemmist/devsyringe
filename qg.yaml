---
version: 0
provider:
  name: github
  configuration:
    default-branch: main
    merge:
      required: true
    runtime:
      action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
      publisher-action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
profiles:
  default:
    runner: ubuntu-latest
    setup:
      - uses: actions/checkout@v7
        with:
          persist-credentials: "false"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Install dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  quality-graph:
    extends: default
    setup:
      - uses: astral-sh/setup-uv@v7
nodes:
  workflow-graph:
    title: Workflow graph validation
    profile: quality-graph
    run: uvx --from quality-graph-cli==0.1.8 --with quality-graph-github==0.1.8 qg validate
  build:
    title: Build binary
    needs: [workflow-graph]
    run: go build ./cmd/dsy
  test:
    title: Run tests
    needs: [workflow-graph]
    run: go test ./...
